<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reedcom Network</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0b0f19; color: #ffffff; padding: 16px; padding-bottom: 120px; min-height: 100vh; user-select: none; }
        .top-bar { display: flex; justify-content: center; margin-bottom: 30px; }
        .connect-wallet-btn { background: linear-gradient(135deg, #00b4db, #0083b0); color: white; border: none; padding: 12px 24px; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; width: 85%; text-align: center; }
        .wallet-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 8, 15, 0.9); z-index: 100000; justify-content: center; align-items: center; }
        .wallet-modal.open { display: flex; }
        .modal-content { background: #111723; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; width: 90%; max-width: 340px; padding: 24px; text-align: center; position: relative; }
        .close-modal { position: absolute; top: 16px; right: 16px; font-size: 24px; color: #64748b; background: none; border: none; cursor: pointer; }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; }
        .wallet-option { display: flex; align-items: center; width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; margin-bottom: 12px; cursor: pointer; text-align: left; }
        .wallet-logo { width: 35px; height: 35px; border-radius: 8px; margin-right: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }
        .logo-binance { background: #F3BA2F; color: #000; }
        .logo-okx { background: #fff; color: #000; }
        .logo-gate { background: #E84142; color: #fff; }
        .balance-container { text-align: center; margin-bottom: 25px; }
        .balance-label { font-size: 13px; color: #94a3b8; text-transform: uppercase; }
        .balance-amount { font-size: 44px; font-weight: bold; color: #00b4db; }
        
        /* Хардуерно ускорена 3D монета през CSS */
        .coin-container { display: flex; justify-content: center; margin: 30px 0; position: relative; }
        .interactive-coin { 
            width: 220px; 
            height: 220px; 
            border-radius: 50%; 
            background: radial-gradient(circle, #172237 0%, #0e1420 100%); 
            border: 5px solid #00b4db; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            overflow: hidden; 
            position: relative;
            box-shadow: 0 0 35px rgba(0, 180, 219, 0.5);
            transition: transform 0.05s ease;
            will-change: transform;
        }
        
        /* 100% стабилен ефект при натискане на екрана без JS намеса */
        .interactive-coin:active { 
            transform: scale(0.92) rotateX(8deg); 
        }
        
        .coin-image { 
            width: 90px; 
            height: 90px; 
            object-fit: cover; 
            border-radius: 50%; 
            margin: 8px 0;
            pointer-events: none;
        }

        .energy-container { width: 100%; max-width: 400px; margin: 20px auto; background: rgba(255, 255, 255, 0.03); padding: 12px; border-radius: 12px; }
        .energy-text { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; color: #94a3b8; }
        .progress-bar-bg { width: 100%; height: 12px; background-color: #1e293b; border-radius: 6px; overflow: hidden; }
        .progress-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #00b4db, #00ffcc); }
        
        .page-screen { display: none; }
        .page-screen.active { display: block; }
        
        .bottom-nav { position: fixed; bottom: 15px; left: 5%; width: 90%; height: 65px; background-color: #111723; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; display: flex; justify-content: space-around; align-items: center; z-index: 99999; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748b; font-size: 12px; font-weight: bold; cursor: pointer; width: 25%; }
        .nav-item.active { color: #00b4db; }
        
        .floating-text { position: absolute; font-size: 32px; font-weight: bold; color: #00ffcc; pointer-events: none; animation: floatUp 0.6s ease-out forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-70px); } }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="connect-wallet-btn" id="wallet-btn" onclick="document.getElementById('wallet-modal').classList.add('open')">Connect Wallet</button>
    </div>

    <div class="wallet-modal" id="wallet-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="document.getElementById('wallet-modal').classList.remove('open')">&times;</button>
            <div class="modal-title">Connect Web3 Wallet</div>
            <div class="wallet-option" onclick="selectWallet('Binance', '#F3BA2F')"><div class="wallet-logo logo-binance">BNC</div><div>Binance Web3</div></div>
            <div class="wallet-option" onclick="selectWallet('OKX', '#10b981')"><div class="wallet-logo logo-okx">OKX</div><div>OKX Wallet</div></div>
            <div class="wallet-option" onclick="selectWallet('Gate.io', '#ef4444')"><div class="wallet-logo logo-gate">GATE</div><div>Gate.io Wallet</div></div>
        </div>
    </div>

    <!-- ТАБ 1: КЛИКЕР -->
    <div id="screen-tap" class="page-screen active">
        <div class="balance-container"><div class="balance-label">Your Balance</div><div class="balance-amount" id="balance-txt">788 REED</div></div>
        <div class="coin-container" id="coin-area">
            <div class="interactive-coin" onclick="clickCoin(event)">
                <div style="font-size:11px; letter-spacing:2px; color:#88f2ff; font-weight: bold;">REED TOKEN</div>
                <img src="coin.jpg.jpg" alt="Coin" class="coin-image">
                <div style="font-size:13px; color:#00b4db; font-weight: bold;">COMMUNITY</div>
            </div>
        </div>
        <div class="energy-container">
            <div class="energy-text"><span>⚡ Energy</span><span><strong id="energy-txt">1000</strong> / 1000</span></div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="energy-bar"></div></div>
        </div>
    </div>

    <!-- ТАБ 2: ЗАДАЧИ -->
    <div id="screen-tasks" class="page-screen"><div style="text-align:center; padding:50px 20px; color:#94a3b8;">📋 Tasks Section Coming Soon</div></div>
    
    <!-- ТАБ 3: ПРИЯТЕЛI -->
    <div id="screen-friends" class="page-screen"><div style="text-align:center; padding:50px 20px; color:#94a3b8;">👥 Friends Section Coming Soon</div></div>
    
    <!-- ТАБ 4: ПРОФИЛ -->
    <div id="screen-profile" class="page-screen"><div style="text-align:center; padding:50px 20px; color:#00b4db; font-weight:bold;">👤 Connected: @ReedcomUser</div></div>

    <nav class="bottom-nav">
        <div class="nav-item active" id="nav-tap" onclick="switchScreen('nav-tap', 'screen-tap')"><span>⚡</span><span>Tap</span></div>
        <div class="nav-item" id="nav-tasks" onclick="switchScreen('nav-tasks', 'screen-tasks')"><span>📋</span><span>Tasks</span></div>
        <div class="nav-item" id="nav-friends" onclick="switchScreen('nav-friends', 'screen-friends')"><span>👥</span><span>Friends</span></div>
        <div class="nav-item" id="nav-profile" onclick="switchScreen('nav-profile', 'screen-profile')"><span>👤</span><span>Profile</span></div>
    </nav>

    <script>
        let balance = 788;
        let energy = 1000;

        function clickCoin(e) {
            if (energy > 0) {
                balance += 1;
                energy -= 1;
                document.getElementById('balance-txt').textContent = balance + " REED";
                document.getElementById('energy-txt').textContent = energy;
                document.getElementById('energy-bar').style.width = (energy / 10) + "%";

                // Изскачащ текст +1
                let float = document.createElement('div');
                float.className = 'floating-text';
                float.textContent = '+1';
                let rect = document.getElementById('coin-area').getBoundingClientRect();
                
                let clickX = e.clientX ? e.clientX - rect.left : rect.width / 2;
                let clickY = e.clientY ? e.clientY - rect.top : rect.height / 2;
                
                float.style.left = (clickX - 15) + 'px';
                float.style.top = (clickY - 20) + 'px';
                document.getElementById('coin-area').appendChild(float);
                setTimeout(() => float.remove(), 600);
            }
        }

        setInterval(() => {
            if (energy < 1000) {
                energy = Math.min(energy + 3, 1000);
                document.getElementById('energy-txt').textContent = energy;
                document.getElementById('energy-bar').style.width = (energy / 10) + "%";
            }
        }, 1000);

        function selectWallet(name, color) {
            document.getElementById('wallet-modal').classList.remove('open');
            let btn = document.getElementById('wallet-btn');
            btn.textContent = name + ": 0x7a...2f";
            btn.style.background = color;
        }
